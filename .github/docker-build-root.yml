name: Docker Build Root

on:
  push:
    tags:
      - '*-root'
  workflow_dispatch:
    inputs:
      version:
        description: 'Root tag to build (e.g., v2026.4.28-root)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-root-build
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository == 'jiqfu/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "root_tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/jiqfu/hermes-agent:${{ steps.version.outputs.version }}
            ghcr.io/jiqfu/hermes-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
