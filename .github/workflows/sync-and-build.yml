name: Sync from Upstream & Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific upstream tag to sync and build'
        required: false
        type: string
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          UPSTREAM_REPO="NousResearch/hermes-agent"
          git fetch "https://github.com/${UPSTREAM_REPO}.git" main
          UPSTREAM_MAIN_SHA=$(git rev-parse upstream/main)
          echo "Upstream main SHA: $UPSTREAM_MAIN_SHA"
          echo "upstream_sha=$UPSTREAM_MAIN_SHA" >> $GITHUB_ENV

      - name: Check if update needed
        id: check
        run: |
          UPSTREAM_REPO="NousResearch/hermes-agent"
          
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TARGET_TAG="${{ github.event.inputs.tag }}"
            echo "Manual trigger for tag: $TARGET_TAG"
            echo "build=true" >> $GITHUB_OUTPUT
            echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
          else
            TARGET_TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/tags?per_page=1" | python3 -c "import sys,json; tags=json.load(sys.stdin); print(tags[0]['name'] if tags else '')")
            if [ -z "$TARGET_TAG" ]; then
              echo "No upstream tag found, skipping"
              echo "build=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Latest upstream tag: $TARGET_TAG"
            echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
            
            FIXED_TAG="${TARGET_TAG}-root"
            if git rev-parse "$FIXED_TAG" >/dev/null 2>&1; then
              echo "Fixed tag $FIXED_TAG already exists, skipping build"
              echo "build=false" >> $GITHUB_OUTPUT
            else
              echo "Need to build new fixed tag: $FIXED_TAG"
              echo "build=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Fetch target upstream tag
        if: steps.check.outputs.build == 'true'
        run: |
          UPSTREAM_REPO="NousResearch/hermes-agent"
          git fetch "https://github.com/${UPSTREAM_REPO}.git" refs/tags/${{ steps.check.outputs.target_tag }}
          git fetch "https://github.com/${UPSTREAM_REPO}.git" main

      - name: Create fixed tag
        if: steps.check.outputs.build == 'true'
        run: |
          UPSTREAM_REPO="NousResearch/hermes-agent"
          TAG_COMMIT=$(git rev-parse upstream/${{ steps.check.outputs.target_tag }})
          echo "Upstream tag commit: $TAG_COMMIT"
          
          git checkout $TAG_COMMIT --detach
          
          git merge fix/root-run --no-edit
          
          FIXED_TAG="${{ steps.check.outputs.target_tag }}-root"
          git tag -a "$FIXED_TAG" -m "$FIXED_TAG with root-run fix"
          git push origin "$FIXED_TAG" 2>&1
          echo "Created and pushed tag: $FIXED_TAG"
          echo "fixed_tag=$FIXED_TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.fixed_tag }}
            ghcr.io/${{ github.repository }}:latest-root
          cache-from: type=gha
          cache-to: type=gha,mode=max
