name: Sync from Upstream & Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific tag to build'
        required: false
        type: string
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    tags:
      - '**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  sync-from-upstream:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.check.outputs.new_tag }}
      build_tag: ${{ steps.check.outputs.build_tag }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream for new tags
        id: check
        run: |
          UPSTREAM_REPO="NousResearch/hermes-agent"
          
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TARGET_TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TARGET_TAG="${GITHUB_REF#refs/tags/}"
          else
            TARGET_TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/tags?per_page=1" | python3 -c "import sys,json; tags=json.load(sys.stdin); print(tags[0]['name'] if tags else '')")
          fi
          
          if [ -z "$TARGET_TAG" ]; then
            echo "No target tag found"
            echo "new_tag=" >> $GITHUB_OUTPUT
            echo "build_tag=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Target tag: $TARGET_TAG"
          
          if git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Tag $TARGET_TAG already exists in fork"
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "new_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
              echo "build_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
            else
              echo "new_tag=" >> $GITHUB_OUTPUT
              echo "build_tag=" >> $GITHUB_OUTPUT
            fi
          else
            echo "new_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
            echo "build_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Fetch upstream and sync tag
        if: steps.check.outputs.new_tag != ''
        run: |
          UPSTREAM_REPO="NousResearch/hermes-agent"
          git fetch "https://github.com/${UPSTREAM_REPO}.git" --tags
          git checkout "refs/tags/${{ steps.check.outputs.new_tag }}"
          git push origin "refs/tags/${{ steps.check.outputs.new_tag }}"

  build:
    needs: sync-from-upstream
    if: needs.sync-from-upstream.outputs.build_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-from-upstream.outputs.build_tag }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.sync-from-upstream.outputs.build_tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
