name: Sync main → fix/root-run + Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/jiqfu/hermes-agent

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync main to fix/root-run
        run: |
          git config user.name "jiqfu"
          git config user.email "39790096+jiqfu@users.noreply.github.com"
          git fetch origin fix/root-run 2>&1 || true
          git checkout -b fix/root-run origin/fix/root-run 2>/dev/null || git checkout -b fix/root-run
          git merge --no-edit origin/main
          git push origin fix/root-run
          echo "SYNC_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:fix-root-run
            ${{ env.IMAGE_NAME }}:fix-root-run-${{ env.SYNC_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
