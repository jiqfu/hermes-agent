name: Docker Build - Root Tags

on:
  push:
    tags:
      - '*-root'
  workflow_dispatch:
    inputs:
      tag:
        description: '上游 tag 名称（如 v2026.4.27）'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-build-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/root-run
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract upstream tag from push tag
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            # push tag format: v2026.4.27-root → upstream tag: v2026.4.27
            PUSH_TAG="${GITHUB_REF_NAME}"
            TAG="${PUSH_TAG%-root}"
          fi
          echo "upstream_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "push_tag=${TAG}-root" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: ${TAG}"
          echo "Push tag: ${TAG}-root"

      - name: Fetch upstream tag and merge into fix/root-run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch the upstream tag (from our repo, which mirrors upstream)
          git fetch origin refs/tags/${{ steps.extract.outputs.upstream_tag }}:refs/tags/${{ steps.extract.outputs.upstream_tag }} 2>&1 || echo "Tag not found in remote, using HEAD of fix/root-run"
          
          # Merge the tag into fix/root-run (or just continue if tag not found)
          if git rev-parse refs/tags/${{ steps.extract.outputs.upstream_tag }} >/dev/null 2>&1; then
            if git merge --no-edit ${{ steps.extract.outputs.upstream_tag }} 2>&1; then
              echo "Merge successful"
            else
              echo "Merge conflict detected, resolving by keeping root-run version"
              git checkout --ours .
              git add .
              git commit --no-edit
            fi
          else
            echo "No upstream tag found, building from current fix/root-run HEAD"
          fi

      - name: Build image (amd64, smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: hermes-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image starts
        run: |
          docker run --rm --entrypoint /opt/hermes/docker/entrypoint.sh hermes-agent:test --help

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/jiqfu/hermes-agent:${{ steps.extract.outputs.push_tag }}
            ghcr.io/jiqfu/hermes-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push merged branch and tag
        run: |
          git push origin fix/root-run
          git tag -f ${{ steps.extract.outputs.push_tag }} fix/root-run
          git push origin ${{ steps.extract.outputs.push_tag }} --force
