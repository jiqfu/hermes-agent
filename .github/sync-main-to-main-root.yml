name: Sync main to main-root and build latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-main-root
  cancel-in-progress: true

jobs:
  sync-and-build:
    if: github.repository == 'jiqfu/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into main-root
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main-root:main-root
          git checkout main-root
          if git merge --no-edit origin/main 2>&1; then
            echo "Merge successful"
          else
            echo "Merge conflict, resolving by keeping main-root version"
            git checkout --ours .
            git add .
            git commit --no-edit
          fi
          git push origin main-root

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/jiqfu/hermes-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
